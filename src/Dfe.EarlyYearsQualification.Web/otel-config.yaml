receivers:
  otlp:
    protocols:
      http:
        endpoint: "0.0.0.0:4318"

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 75
    spike_limit_percentage: 15
  batch:
    send_batch_size: 10000
    timeout: 2s
  resource:
    attributes:
      - key: service.name
        value: "$${env:OTEL_SERVICE_NAME}"
        action: upsert

exporters:
  otlphttp/splunk:
    endpoint: "https://ingest.$${env:SPLUNK_REALM}.observability.splunkcloud.com"
    headers:
      "X-SF-Token": "$${env:SPLUNK_ACCESS_TOKEN}"

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [otlphttp/splunk]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [otlphttp/splunk]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [otlphttp/splunk]