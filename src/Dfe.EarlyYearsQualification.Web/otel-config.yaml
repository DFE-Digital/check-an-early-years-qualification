receivers:
  otlp:
    protocols:
      http:
        endpoint: "0.0.0.0:4318"

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 75
    spike_limit_percentage: 15
  batch:
    send_batch_size: 10000
    timeout: 2s
  resource:
    attributes:
      - action: upsert
        key: service.name
        value: "${env:OTEL_SERVICE_NAME}"
        

exporters:
  otlphttp/splunk:
    traces_endpoint: "https://ingest.${env:SPLUNK_REALM}.observability.splunkcloud.com/v2/trace/otlp"
    metrics_endpoint: "https://ingest.${env:SPLUNK_REALM}.observability.splunkcloud.com/v2/datapoint/otlp"
    logs_endpoint: "https://ingest.${env:SPLUNK_REALM}.observability.splunkcloud.com/v1/log"
    headers:
      "X-SF-Token": "${env:SPLUNK_ACCESS_TOKEN}"

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [otlphttp/splunk]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [otlphttp/splunk]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [otlphttp/splunk]